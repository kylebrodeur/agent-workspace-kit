name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The node floor is the package's own: "engines": { "node":
          # ">=24" }. The family standard is the same, and a CI that
          # runs an OLDER node than the package declares is testing a
          # runtime the package refuses to install on.
          node-version: "24"
      - name: Test suite
        run: npm test

  prose-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deterministic prose gate over the tracked markdown
        run: sh scripts/prose-gate.sh